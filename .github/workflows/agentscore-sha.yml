# Publish the AgentScore image for this branch. The cloud agent token can push
# the repo but cannot write GHCR packages; Actions can. SHA tag only.
name: agentscore-sha

on:
  push:
    branches:
      - cursor/agentscore-synteq-proof-14b7
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared core into the app
        run: node tools/sync.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/agentscore
          file: apps/agentscore/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dewars30/what-the-agent-sees-agentscore:${{ github.sha }}
