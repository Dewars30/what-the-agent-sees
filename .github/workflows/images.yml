name: images

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'tools/sync.mjs'
      - '.github/workflows/images.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [agentscore, roast, sitefm, agentornot, agentrank, llmsforge, botyotyoty]
    steps:
      - uses: actions/checkout@v4

      - name: Sync shared core into the app
        run: node tools/sync.mjs

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dewars30/what-the-agent-sees-${{ matrix.app }}:latest
            ghcr.io/dewars30/what-the-agent-sees-${{ matrix.app }}:${{ github.sha }}
